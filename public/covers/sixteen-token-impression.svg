    <line x1="640" y1="540" x2="1120" y2="540" stroke="#161513" stroke-opacity="0.6" stroke-width="1"/>

    <!-- 16 软 token 模块示意 -->
    <g transform="translate(650, 420)">
      <rect x="0" y="0" width="170" height="42" rx="3" fill="#D9392B" fill-opacity="0.12" stroke="#D9392B" stroke-width="1.5"/>
      <text x="85" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#D9392B">16 SOFT TOKENS</text>

      <path d="M 175 21 L 210 21" stroke="#161513" stroke-width="1.5"/>
      
      <rect x="215" y="0" width="220" height="42" rx="3" fill="#161513" fill-opacity="0.05" stroke="#161513" stroke-width="1.2"/>
