    <!-- 同数据对照指标 -->
    <!-- 方案 A: 软 token -->
    <text x="650" y="488" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#161513">SOFT TOKENS · 65K params</text>
